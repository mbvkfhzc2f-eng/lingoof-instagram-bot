name: Instagram token yenileme

# Uzun ömürlü token 60 gün geçerli; yenilendikçe 60 gün uzar. Üç günde bir denenir, biri kaçsa da token canlı kalır.
on:
  schedule:
    - cron: '43 3 */3 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Token'ı yenile
        env:
          TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          resp=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${TOKEN}")
          new=$(printf '%s' "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
          if [ -z "$new" ]; then
            # 24 saatten yeni token yenilenemez; hâlâ çalışıyorsa sorun yok
            if curl -sf "https://graph.instagram.com/me?fields=user_id&access_token=${TOKEN}" > /dev/null; then
              echo "Token şimdilik yenilenmedi ama geçerli; bir sonraki seferde tekrar denenecek."
              exit 0
            fi
            echo "::error::Token geçersiz ya da süresi dolmuş. README'deki adımla yeni token üretip IG_TOKEN'ı güncelle."
            exit 1
          fi
          echo "::add-mask::$new"
          days=$(printf '%s' "$resp" | python3 -c 'import sys,json; print(int(json.load(sys.stdin).get("expires_in",0))//86400)')
          if [ "$new" = "$TOKEN" ]; then
            echo "Token uzatıldı: ${days} gün geçerli."
          elif [ -n "${GH_PAT:-}" ]; then
            printf '%s' "$new" | GH_TOKEN="$GH_PAT" gh secret set IG_TOKEN --repo "$REPO"
            echo "Yeni token kaydedildi: ${days} gün geçerli."
          else
            echo "::error::Meta yeni bir token verdi ama GH_PAT olmadığı için kaydedemedim. README'deki GH_PAT adımını yap."
            exit 1
          fi
