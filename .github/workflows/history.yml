name: Instagram geçmişini tara

# Hesaptaki tüm geçmiş gönderileri history.md dosyasına yazar. Hiçbir şey paylaşmaz.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Geçmişi listele
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 history.py
      - name: Kaydet
        run: |
          git config user.name "lingoof-bot"
          git config user.email "lingoof-bot@users.noreply.github.com"
          git add history.json history.md
          if ! git diff --cached --quiet; then
            git commit -m "Instagram geçmişi"
            for i in 1 2 3; do git push && break; git pull --rebase; done
          fi
